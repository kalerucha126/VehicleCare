{% extends "base.html" %}
{% block title %}Add Service · VehicleCare{% endblock %}
{% block content %}
<h1 class="mb-4">Add Service Record — {{ vehicle.make }} {{ vehicle.model }}</h1>
<form method="post" class="col-md-6">
  <div class="mb-3">
    <label class="form-label">Service Type</label>
    <input type="text" name="service_type" class="form-control" placeholder="e.g. Oil Change" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Date</label>
    <input type="date" name="date" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Cost</label>
    <input type="number" step="0.01" name="cost" class="form-control">
  </div>
  <div class="mb-3">
    <label class="form-label">Notes</label>
    <textarea name="notes" class="form-control" rows="3"></textarea>
  </div>
  <div class="mb-3">
    <label class="form-label">Next Due Date</label>
    <input type="date" name="next_due_date" class="form-control">
  </div>
  <button type="submit" class="btn btn-primary">Save Service</button>
  <a href="{{ url_for('vehicle_detail', vehicle_id=vehicle.id) }}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
