{% extends "base.html" %}
{% block title %}Add Vehicle · VehicleCare{% endblock %}
{% block content %}
<h1 class="mb-4">Add Vehicle</h1>
<form method="post" class="col-md-6">
  <div class="mb-3">
    <label class="form-label">Make</label>
    <input type="text" name="make" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Model</label>
    <input type="text" name="model" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Year</label>
    <input type="number" name="year" class="form-control" min="1900" max="2100">
  </div>
  <div class="mb-3">
    <label class="form-label">License Plate</label>
    <input type="text" name="license_plate" class="form-control">
  </div>
  <div class="mb-3">
    <label class="form-label">Owner Name</label>
    <input type="text" name="owner_name" class="form-control">
  </div>
  <button type="submit" class="btn btn-primary">Save Vehicle</button>
  <a href="{{ url_for('list_vehicles') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
